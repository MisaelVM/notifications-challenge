name: notifications-challenge

services:
  postgres-db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${DATABASE_NAME:-postgres_db}

  postgres-test-db:
    image: postgres:18.4-alpine
    profiles: [ test ]
    restart: on-failure
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    env_file:
      - .env.test

volumes:
  postgres-data:
  postgres-test-data:
