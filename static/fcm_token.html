<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get FCM Token</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.1.3/material.orange-indigo.min.css"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.1.3/material.min.js"
    ></script>
    <link href="css/main.css" rel="stylesheet" />
  </head>
  <body>
    <script src="js/firebase-messaging.js" type="module"></script>

    <div class="demo-layout mdl-layout mdl-js-layout mdl-layout--fixed-header">
      <!-- Header section containing title -->
      <header
        class="mdl-layout__header mdl-color-text--white mdl-color--light-blue-700"
      >
        <div class="mdl-cell mdl-cell--12-col mdl-cell--12-col-tablet mdl-grid">
          <div
            class="mdl-layout__header-row mdl-cell mdl-cell--12-col mdl-cell--12-col-tablet mdl-cell--8-col-desktop"
          >
            <h3>Get FCM Token</h3>
          </div>
        </div>
      </header>

      <main class="mdl-layout__content mdl-color--grey-100">
        <div class="mdl-cell mdl-cell--12-col mdl-cell--12-col-tablet mdl-grid">
          <!-- Container for the Table of content -->
          <div
            class="mdl-card mdl-shadow--2dp mdl-cell mdl-cell--12-col mdl-cell--12-col-tablet mdl-cell--12-col-desktop"
          >
            <div class="mdl-card__supporting-text mdl-color-text--grey-600">
              <!-- div to display the generated registration token -->
              <div id="token_div" style="display: none">
                <h4>Firebase Installation ID</h4>
                Your
                <span style="font-weight: 700">FCM Token</span>
                is:
                <p id="token" style="word-break: break-all"></p>
              </div>
              <!-- div to display the UI to allow the request for permission to
               notify the user. This is shown if the app has not yet been
               granted permission to notify. -->
              <div id="permission_div">
                <div
                  style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    column-gap: 2rem;
                  "
                >
                  <h4>Needs Permission</h4>
                  <button
                    id="request-permission-button"
                    class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored"
                  >
                    Request Permission
                  </button>
                </div>
                <p style="text-align: center">
                  You need to allow notifications for this site to work properly
                </p>
              </div>
              <!-- div to display messages received by this app. -->
              <div id="notifications"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
