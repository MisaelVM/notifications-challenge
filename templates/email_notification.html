<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f9;
        color: #333333;
      }
      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #f4f7f9;
        padding-bottom: 40px;
      }
      .main {
        background-color: #ffffff;
        margin: 0 auto;
        width: 100%;
        max-width: 600px;
        border-spacing: 0;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 40px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .header {
        background-color: #2563eb;
        padding: 30px;
        text-align: center;
        color: #ffffff;
      }
      .header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      .content {
        padding: 30px;
        line-height: 1.6;
        font-size: 16px;
      }
      .footer {
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: #9ca3af;
      }
      @media screen and (max-width: 600px) {
        .main {
          width: 95% !important;
          margin-top: 20px !important;
        }
      }
    </style>
  </head>
  <body>
    <center class="wrapper">
      <table class="main" width="100%">
        <!-- Header -->
        <tr>
          <td class="header">
            <h1>{{ title }}</h1>
          </td>
        </tr>

        <!-- Body Content -->
        <tr>
          <td class="content">{{ content }}</td>
        </tr>
      </table>
    </center>
  </body>
</html>
